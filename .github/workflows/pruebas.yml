# W6 (auditoría P10): ruff + pytest en cada PR y en main. Sin torch ni demucs:
# las pruebas de stems no los cargan. Railway no mira esta carpeta (no redespliega).
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: ffmpeg y libsndfile
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libsndfile1
      - name: Dependencias
        run: pip install -r requirements.txt pytest ruff
      - name: Ruff (errores de sintaxis y nombres sin definir)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Pytest
        env:
          WORKER_API_URL: http://prueba.invalid
          WORKER_SECRET: prueba
        run: pytest -q
